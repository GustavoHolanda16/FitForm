<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FitInform - Home</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            margin: 6px 0;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            background: #3498db;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
        }
        a:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bem-vindo, {{ user.nome }}!</h1>
        <p><strong>Altura:</strong> {{ user.altura }} m</p>
        <p><strong>Peso:</strong> {{ user.peso }} kg</p>
        <a href="{{ url_for('main.logout') }}">Sair</a>
    </div>
</body>
</html>
